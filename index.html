<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>בינגו עברית - Hebrew Bingo Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            color: #4682b4;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .input-area {
            margin-bottom: 20px;
            text-align: right;
        }
        
        #wordInput {
            width: 70%;
            padding: 10px;
            border: 2px solid #4682b4;
            border-radius: 5px;
            font-size: 16px;
            text-align: right;
        }
        
        .batch-hint {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .control-panel {
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .grid-size {
            margin: 10px 0;
        }
        
        button {
            background-color: #4682b4;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #3a6d99;
        }
        
        .word-list {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
            text-align: right;
            min-height: 50px;
        }
        
        .empty-message {
            color: #666;
            font-style: italic;
        }
        
        .word-pill {
            display: inline-block;
            background-color: #4682b4;
            color: white;
            padding: 5px 10px;
            margin: 3px;
            border-radius: 15px;
            cursor: pointer;
        }
        
        #cards-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        #print-container {
            display: none;
        }

        /* Pre-print: rendered off-screen so Chrome lays out the content before window.print() */
        #print-container.pre-print {
            display: block;
            position: fixed;
            left: -99999px;
            top: 0;
            visibility: hidden;
        }

        .print-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 50px;
            margin-bottom: 20px;
            page-break-after: always;
        }
        
        .bingo-card {
            border: 3px solid #4682b4;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .card-title {
            background-color: #4682b4;
            color: white;
            padding: 10px;
            font-size: 24px;
            font-weight: bold;
        }
        
        .bingo-grid {
            display: grid;
            grid-gap: 5px;
            padding: 10px;
            justify-content: center;
        }
        
        .bingo-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            padding: 10px;
            border: 2px solid #4682b4;
            border-radius: 5px;
            background-color: #e6f2ff;
            text-align: center;
            width: 107px;
            height: 107px;
            overflow: hidden;
            margin: auto;
        }
        
        .bingo-cell span {
            max-width: 100%;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            line-height: 1.2;
        }
        
        .print-button-bar {
            margin: 20px 0;
        }
        
        @keyframes cardAppear {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            70% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        @keyframes cellReveal {
            0% {
                transform: rotateY(90deg);
                opacity: 0;
            }
            100% {
                transform: rotateY(0deg);
                opacity: 1;
            }
        }
        
        @media print {
            body, html {
                background-color: white;
                margin: 0;
                padding: 0;
            }

            .container, .input-area, .control-panel, .word-list, .button-row, h1, #cards-container, .print-button-bar {
                display: none !important;
            }

            /* Override pre-print off-screen positioning */
            #print-container {
                display: block !important;
                position: static !important;
                left: auto !important;
                top: auto !important;
                visibility: visible !important;
                width: 100% !important;
                margin: 0;
                padding: 0;
            }

            .print-page {
                height: 100vh;
                margin: 0;
                padding: 10px 0;
                box-sizing: border-box;
                page-break-after: always;
                break-after: page;
                gap: 20px;
            }

            .bingo-card {
                box-shadow: none;
                border: 2px solid black;
                border-radius: 0;
                margin: 0;
                overflow: visible;
                /* Override JS-set inline width so the card fits the page */
                width: auto !important;
            }

            .card-title {
                display: none;
            }

            .bingo-grid {
                padding: 5px;
            }

            /* Cell sizes per grid — scaled to fit 2 cards on one A4 page */
            .bingo-cell {
                border: 1px solid black;
                background-color: white !important;
                font-size: 16px !important;
                /* Default (3×3): 107px fits fine */
                width: 107px !important;
                height: 107px !important;
            }

            [data-grid-size="4"] .bingo-cell {
                width: 90px !important;
                height: 90px !important;
                font-size: 14px !important;
            }

            [data-grid-size="5"] .bingo-cell {
                width: 75px !important;
                height: 75px !important;
                font-size: 13px !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>בינגו עברית - Hebrew Bingo Generator</h1>
        
        <div class="input-area">
            <input type="text" id="wordInput" placeholder="הכנס מילה או מילים מופרדות בפסיקים..." />
            <button onclick="addWord()">הוסף מילה/ים</button>
            <div class="batch-hint">להוספת מספר מילים בבת אחת, הפרד אותן עם פסיקים. לדוגמה: כלב, חתול, אריה</div>
        </div>
        
        <div class="word-list" id="wordList">
            <!-- The empty message will be inserted by JavaScript -->
        </div>
        
        <div class="control-panel">
            <div class="grid-size">
                <label for="gridSize">גודל הכרטיס:</label>
                <select id="gridSize">
                    <option value="3" selected>3x3</option>
                    <option value="4">4x4</option>
                    <option value="5">5x5</option>
                </select>
            </div>
            
            <div class="card-count">
                <label for="cardCount">מספר כרטיסים:</label>
                <input type="number" id="cardCount" min="1" max="40" value="4" style="width: 60px;">
            </div>
            
            <div class="free-space">
                <input type="checkbox" id="freeSpace">
                <label for="freeSpace">משבצת חופשית באמצע</label>
            </div>
        </div>
        
        <div class="button-row">
            <button onclick="generateCards()">צור כרטיסי בינגו</button>
            <button onclick="clearWords()">נקה את כל המילים</button>
        </div>
        
        <div id="cards-container"></div>
        
        <div class="print-button-bar" id="printButtonBar" style="display: none;">
            <button onclick="preparePrint()">הדפס כרטיסים</button>
            <p>שני כרטיסי בינגו יודפסו בכל עמוד</p>
        </div>
    </div>
    
    <!-- Separate container for print layout that will only be shown when printing -->
    <div id="print-container"></div>

    <script>
        const words = [];
        
        // Initialize the word list when the page loads
        document.addEventListener('DOMContentLoaded', function() {
            updateWordList();
        });
        
        // Add word when Enter key is pressed
        document.getElementById('wordInput').addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                addWord();
            }
        });
        
        function addWord() {
            const input = document.getElementById('wordInput');
            const inputText = input.value.trim();
            
            if (!inputText) return;
            
            // Split by comma and process multiple words if needed
            const newWords = inputText.split(',').map(word => word.trim()).filter(word => word);
            
            let wordsAdded = 0;
            
            // Add each word if it's not already in the list
            newWords.forEach(word => {
                if (!words.includes(word)) {
                    words.push(word);
                    wordsAdded++;
                }
            });
            
            if (wordsAdded > 0) {
                updateWordList();
                input.value = '';
                
                // Show a message if multiple words were added
                if (wordsAdded > 1) {
                    alert(`נוספו ${wordsAdded} מילים חדשות לרשימה.`);
                }
            }
            
            input.focus();
        }
        
        function updateWordList() {
            const wordListDiv = document.getElementById('wordList');
            wordListDiv.innerHTML = ''; // Clear the word list div
            
            if (words.length > 0) {
                // Add word pills
                words.forEach((word, index) => {
                    const wordPill = document.createElement('span');
                    wordPill.className = 'word-pill';
                    wordPill.textContent = word;
                    wordPill.addEventListener('click', function() {
                        // Remove the word when clicked
                        words.splice(index, 1);
                        updateWordList();
                    });
                    wordListDiv.appendChild(wordPill);
                });
            } else {
                // Show the empty message
                const emptyMessage = document.createElement('p');
                emptyMessage.className = 'empty-message';
                emptyMessage.textContent = 'אין מילים עדיין. הוסף לפחות 9 מילים ליצירת כרטיסי בינגו בגודל 3x3.';
                wordListDiv.appendChild(emptyMessage);
            }
        }
        
        function clearWords() {
            words.length = 0;
            updateWordList();
            document.getElementById('printButtonBar').style.display = 'none';
            document.getElementById('cards-container').innerHTML = '';
            document.getElementById('print-container').innerHTML = '';
        }
        
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }
        
        function generateCards() {
            const gridSize = parseInt(document.getElementById('gridSize').value);
            const cardCount = parseInt(document.getElementById('cardCount').value);
            const hasFreeSpace = document.getElementById('freeSpace').checked;
            
            const minWords = gridSize * gridSize - (hasFreeSpace ? 1 : 0);
            
            if (words.length < minWords) {
                alert(`נדרשות לפחות ${minWords} מילים כדי ליצור כרטיס בינגו בגודל ${gridSize}x${gridSize}${hasFreeSpace ? ' עם משבצת חופשית' : ''}.`);
                return;
            }
            
            const cardsContainer = document.getElementById('cards-container');
            cardsContainer.innerHTML = '';
            
            // Fixed cell size of 107px
            const cellSize = 131;
            
            // Calculate card width based on grid size and cell size
            // Formula: (cellSize * gridSize) + (padding * 2) + (gridGap * (gridSize-1))
            const cardWidth = (cellSize * gridSize) + 20 + (5 * (gridSize-1));
            
            // Generate cards for display in the UI
            for (let i = 0; i < cardCount; i++) {
                const card = createBingoCard(i, gridSize, hasFreeSpace, cardWidth, cellSize);
                card.style.animation = `cardAppear 0.5s ease-out ${i * 0.2}s backwards`;
                cardsContainer.appendChild(card);
            }
            
            // Show the print button
            document.getElementById('printButtonBar').style.display = 'block';
        }
        
        function createBingoCard(index, gridSize, hasFreeSpace, cardWidth, cellSize) {
            const shuffledWords = shuffleArray(words);

            const card = document.createElement('div');
            card.className = 'bingo-card';
            card.style.width = `${cardWidth}px`;
            card.dataset.gridSize = gridSize;
            
            const cardTitle = document.createElement('div');
            cardTitle.className = 'card-title';
            cardTitle.textContent = 'בינגו!';
            card.appendChild(cardTitle);
            
            const grid = document.createElement('div');
            grid.className = 'bingo-grid';
            grid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            
            // Calculate the middle cell position if free space is enabled
            const middleCell = hasFreeSpace ? Math.floor(gridSize * gridSize / 2) : -1;
            
            let wordIndex = 0;
            for (let j = 0; j < gridSize * gridSize; j++) {
                const cell = document.createElement('div');
                cell.className = 'bingo-cell';
                cell.style.animation = `cellReveal 0.5s ease-out ${j * 0.05}s backwards`;
                
                const content = document.createElement('span');
                
                if (j === middleCell && hasFreeSpace) {
                    // Free space in the middle
                    content.textContent = 'חופשי';
                    cell.style.backgroundColor = '#ffcc99';
                } else {
                    // Regular word cell
                    if (wordIndex < shuffledWords.length) {
                        content.textContent = shuffledWords[wordIndex];
                        wordIndex++;
                    }
                }
                
                cell.appendChild(content);
                grid.appendChild(cell);
            }
            
            card.appendChild(grid);
            return card;
        }
        
        function preparePrint() {
            const gridSize = parseInt(document.getElementById('gridSize').value);
            const cardCount = parseInt(document.getElementById('cardCount').value);
            const hasFreeSpace = document.getElementById('freeSpace').checked;

            const cellSize = 131;
            const cardWidth = (cellSize * gridSize) + 20 + (5 * (gridSize-1));

            const printContainer = document.getElementById('print-container');
            printContainer.innerHTML = '';

            for (let i = 0; i < cardCount; i += 2) {
                const printPage = document.createElement('div');
                printPage.className = 'print-page';

                printPage.appendChild(createBingoCard(i, gridSize, hasFreeSpace, cardWidth, cellSize));

                if (i + 1 < cardCount) {
                    printPage.appendChild(createBingoCard(i + 1, gridSize, hasFreeSpace, cardWidth, cellSize));
                }

                printContainer.appendChild(printPage);
            }

            // Strip staggered animations — cells captured mid-animation cause progressive
            // border thinning in Chrome due to opacity/rotateY at different stages
            printContainer.querySelectorAll('.bingo-cell').forEach(cell => {
                cell.style.animation = 'none';
            });

            // Make container visible off-screen so Chrome renders it before window.print()
            printContainer.classList.add('pre-print');
            void printContainer.offsetHeight; // force layout

            window.onafterprint = function() {
                printContainer.classList.remove('pre-print');
                window.onafterprint = null;
            };

            setTimeout(() => window.print(), 200);
        }
    </script>
</body>
</html>
